  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Download Button — Success & Fail",
    "description": "An animated download button with progress, success and failure state transitions. Pure HTML, CSS & JavaScript microinteraction.",
    "url": "https://mrchandrayee.github.io/download-button-animation/",
    "author": { "@type": "Person", "name": "mrchandrayee", "url": "https://github.com/mrchandrayee" },
    "applicationCategory": "WebApplication",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <meta name="theme-color" content="#06111e">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <header>
      <div class="eyebrow">INTERACTIVE UI COMPONENT</div>
      <h1>Download Button</h1>
      <p>Two outcomes. One satisfying interaction.</p>
    </header>

    <section class="button-stage" aria-label="Download button examples">
      <article class="example">
        <button class="download-button success" id="successButton" type="button" aria-label="Try successful download">
          <span class="ring"></span>
          <svg class="symbol" viewBox="0 0 48 48" aria-hidden="true">
            <path class="arrow" d="M24 8v25m-10-10 10 10 10-10"/>
            <path class="check" d="m12 24 8 8 17-18"/>
            <path class="minus" d="M13 24h22"/>
          </svg>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <h2 class="status success-text" id="successStatus">SUCCESS</h2>
        <p>Ready when clicked</p>
      </article>

      <article class="example">
        <button class="download-button fail" id="failButton" type="button" aria-label="Try failed download">
          <span class="ring"></span>
          <svg class="symbol" viewBox="0 0 48 48" aria-hidden="true">
            <path class="arrow" d="M24 8v25m-10-10 10 10 10-10"/>
            <path class="check" d="m12 24 8 8 17-18"/>
            <path class="minus" d="M13 24h22"/>
          </svg>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <h2 class="status fail-text" id="failStatus">FAIL</h2>
        <p>Simulated error state</p>
      </article>
    </section>

    <div class="message" id="message" aria-live="polite">Choose a button to preview its animation.</div>
    <button class="reset" id="resetButton" type="button">↻ Reset animation</button>
    <footer><span class="footer-mark">●</span> CODE_AND_CHILL</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
